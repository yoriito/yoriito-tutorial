name: Build on devcontainer(desktop environment)

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: LargeSizeRunner
    steps:
    - uses: actions/checkout@v6

    - name: docker login
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Start Docker Container
      run: |
        docker container run -d \
          --name builder \
          -v "${{ github.workspace }}:/work" \
          -w /work \
          --entrypoint /init \
          --cap-add NET_ADMIN \
          ${{ vars.DEVCONTAINER_IMAGE }}

    - name: Configure
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            mkdir build
            cmake -S /work -B /work/build
          '

    - name: Build
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            cmake --build /work/build -j$(nproc)
          '
