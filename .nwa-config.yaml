    See the License for the specific language governing permissions and
    limitations under the License.
  skip:
    - ".devcontainer/**" # Dev container configuration
    - "**/*.md"
    - "**/*.html"
    - "**/*.csv"
    - "**/*.json"
    - "**/*.toml"
    - "**/generated/**"
    - "**/*pb2.*"
    - "**/*pb2_grpc.*"
    - "**/*.pb.*"
    - "**/*.pbenum.*"
    - "**/*.pbgrpc.*"
    - "**/*.pbjson.*"
    - "ref_ui/windows/**" # Generated by flutter
    - "ref_ui/ios/**" # Generated by flutter
    - "ref_ui/android/**" # Generated by flutter
    - "ref_ui/linux/**" # Generated by flutter
    - "ref_ui/macos/**" # Generated by flutter
    - "ref_ui/web/**" # Generated by flutter
    - "ref_ui/test/**" # Generated by flutter
    - "ref_app/gen/**" # Generated by gRPC
    - "**/.dart_tool/**" # Generated by dart
    - "external/**" # External dependencies
  path:
    - "**/*.cc"
    - "**/*.cpp"
    - "**/*.h"
    - "**/*.c"
    - "**/CMakeLists.txt"
    - "**/*.cmake"
    - "**/*.vspec"
    - "**/*.sh"
    - "**/*.rs"
    - "**/*.dart"
    - "**/*.py"
    - "**/*.proto"
    - "**/*.yml"
  style: ["vspec:hash"]
