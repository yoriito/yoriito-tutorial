syntax = "proto3";

package emrgency;
option cc_generic_services = false;

import "google/protobuf/empty.proto";

// Toggle state request.
message ToggleRequest {
  bool is_on = 1;  // true=ON, false=OFF
}

// empty response.
message ToggleResponse {
  google.protobuf.Empty empty = 1;
}

service EmergencyService {
  // Set toggle state.
  rpc SetToggleState (ToggleRequest) returns (ToggleResponse);
}